# Her gönderimde ve çekme isteğinde: biçim/lint, tip denetimi, birim ve entegrasyon testleri, derleme;
# ardından gerçek PostgreSQL 18 üzerinde uçtan uca (Playwright) testler.
name: Denetim

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  denetim:
    name: Lint, tip, test, derleme
    runs-on: ubuntu-latest
    env:
      # Derleme ve PGlite testleri gerçek bir veritabanına bağlanmaz
      DATABASE_URL: postgres://iz:iz@localhost:5432/iz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  uctan-uca:
    name: Uçtan uca testler
    runs-on: ubuntu-latest
    needs: denetim
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: iz
          POSTGRES_PASSWORD: iz
          POSTGRES_DB: iz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iz -d iz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://iz:iz@localhost:5432/iz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-raporu
          path: test-results/
          retention-days: 7
